# .NET API Pipeline
# Uses modular CI/CD template with App Service deployment

trigger:
  branches:
    include:
      - main
      - develop
      - feature/*
  paths:
    include:
      - examples/dotnet-api/**

pr:
  branches:
    include:
      - main
      - develop

variables:
  - group: sonarcloud-barings
  - name: workingDirectory
    value: 'examples/dotnet-api'

# Full pipeline: CI → Scan → UT → ST → PR
extends:
  template: /.azure-pipelines/templates/ci-cd-full.yml
  parameters:
    language: dotnet
    deployTarget: appservice
    workingDirectory: $(workingDirectory)
    configLevel: strict  # Production API uses strict rules
    coverageThreshold: 90
    appServiceName: 'app-dotnet-api'
