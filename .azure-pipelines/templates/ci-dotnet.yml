# .NET CI Template (Convenience Wrapper)
# Wraps the new modular architecture for backwards compatibility
# Prefer using ci-only.yml or ci-cd-full.yml directly for new projects

parameters:
  - name: dotnetVersion
    type: string
    default: '8.0.x'

  - name: solutionPath
    type: string
    default: '**/*.sln'

  - name: workingDirectory
    type: string
    default: '.'

  - name: buildConfiguration
    type: string
    default: 'Release'

  - name: coverageThreshold
    type: number
    default: 90

  - name: configLevel
    type: string
    default: 'base'
    values:
      - relaxed
      - base
      - strict

  - name: runSonar
    type: boolean
    default: true

stages:
  - template: ci-only.yml
    parameters:
      language: dotnet
      workingDirectory: ${{ parameters.workingDirectory }}
      configLevel: ${{ parameters.configLevel }}
      coverageThreshold: ${{ parameters.coverageThreshold }}
      runLint: true
      runTests: true
      runSonar: ${{ parameters.runSonar }}
      runDependencyScan: true
      runSecretScan: true
      buildArtifact: true
