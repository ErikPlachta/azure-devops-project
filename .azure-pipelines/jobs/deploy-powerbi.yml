# Deploy Power BI Reports (PBIX and RDL)
# Imports reports to workspace, rebinds data sources, triggers refresh

parameters:
  # Required
  - name: environment
    type: string
    values: [development, staging, production]
  - name: workspaceId
    type: string
    displayName: 'Power BI Workspace GUID'
  - name: azureSubscription
    type: string
    displayName: 'Azure service connection'

  # Report source
  - name: reportPath
    type: string
    default: 'reports'
    displayName: 'Path to reports folder or file'

  # Data source configuration
  - name: dataSourceConfigFile
    type: string
    default: ''
    displayName: 'Path to datasource-config.json'
  - name: rebindDataSource
    type: boolean
    default: true
    displayName: 'Rebind data sources per environment'

  # Refresh options
  - name: refreshDataset
    type: boolean
    default: true
    displayName: 'Trigger dataset refresh after deploy'
  - name: refreshTimeout
    type: number
    default: 30
    displayName: 'Refresh timeout in minutes'
  - name: waitForRefresh
    type: boolean
    default: true
    displayName: 'Wait for refresh to complete'

  # Import options
  - name: conflictAction
    type: string
    default: 'CreateOrOverwrite'
    values: [CreateOrOverwrite, Abort, Ignore]
  - name: takeOwnership
    type: boolean
    default: true
    displayName: 'Take ownership (required for RDL)'

  # Service Principal (use variables, not hardcoded)
  - name: tenantId
    type: string
    default: ''
  - name: clientId
    type: string
    default: ''
  - name: clientSecret
    type: string
    default: ''

  # Job config
  - name: pool
    type: object
    default:
      vmImage: 'windows-latest'
  - name: dependsOn
    type: object
    default: []
  - name: condition
    type: string
    default: 'succeeded()'
  - name: enabled
    type: boolean
    default: true

jobs:
  - deployment: Deploy_PowerBI_${{ parameters.environment }}
    displayName: 'Deploy Power BI (${{ parameters.environment }})'
    pool: ${{ parameters.pool }}
    dependsOn: ${{ parameters.dependsOn }}
    condition: and(${{ parameters.condition }}, eq(${{ parameters.enabled }}, true))
    environment: 'powerbi-${{ parameters.environment }}'
    strategy:
      runOnce:
        deploy:
          steps:
            - checkout: self
              sparse-checkout: |
                .azure-pipelines/scripts/powerbi
                ${{ parameters.reportPath }}
                ${{ parameters.dataSourceConfigFile }}

            # Install PowerShell modules
            - task: PowerShell@2
              displayName: 'Install Power BI Modules'
              inputs:
                targetType: 'inline'
                script: |
                  Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
                  Install-Module -Name MicrosoftPowerBIMgmt -Force -Scope CurrentUser -AllowClobber
                pwsh: true

            # Connect to Power BI
            - task: PowerShell@2
              displayName: 'Connect to Power BI'
              inputs:
                targetType: 'inline'
                script: |
                  $tenantId = if ('${{ parameters.tenantId }}') { '${{ parameters.tenantId }}' } else { $env:TENANT_ID }
                  $clientId = if ('${{ parameters.clientId }}') { '${{ parameters.clientId }}' } else { $env:CLIENT_ID }
                  $clientSecret = if ('${{ parameters.clientSecret }}') { '${{ parameters.clientSecret }}' } else { $env:CLIENT_SECRET }

                  if (-not $tenantId -or -not $clientId -or -not $clientSecret) {
                    Write-Error "Missing credentials. Set POWERBI_TENANT_ID, POWERBI_CLIENT_ID, POWERBI_CLIENT_SECRET variables"
                    exit 1
                  }

                  $secureSecret = ConvertTo-SecureString $clientSecret -AsPlainText -Force
                  $credential = New-Object System.Management.Automation.PSCredential($clientId, $secureSecret)
                  Connect-PowerBIServiceAccount -ServicePrincipal -Credential $credential -TenantId $tenantId

                  Write-Host "Connected to Power BI as Service Principal"
                pwsh: true
              env:
                TENANT_ID: $(POWERBI_TENANT_ID)
                CLIENT_ID: $(POWERBI_CLIENT_ID)
                CLIENT_SECRET: $(POWERBI_CLIENT_SECRET)

            # Deploy reports
            - task: PowerShell@2
              name: DeployReports
              displayName: 'Deploy Reports'
              inputs:
                filePath: '.azure-pipelines/scripts/powerbi/deploy-report.ps1'
                arguments: >-
                  -WorkspaceId '${{ parameters.workspaceId }}'
                  -ReportPath '${{ parameters.reportPath }}'
                  -ConflictAction '${{ parameters.conflictAction }}'
                pwsh: true

            # Rebind data sources
            - ${{ if and(eq(parameters.rebindDataSource, true), ne(parameters.dataSourceConfigFile, '')) }}:
              - task: PowerShell@2
                displayName: 'Rebind Data Sources'
                inputs:
                  targetType: 'inline'
                  script: |
                    $deployedJson = '$(DeployReports.DeployedReports)'
                    if (-not $deployedJson -or $deployedJson -eq '') {
                      Write-Host "No deployed reports to rebind"
                      exit 0
                    }

                    $deployedReports = $deployedJson | ConvertFrom-Json

                    foreach ($report in $deployedReports) {
                      if ($report.DatasetId) {
                        Write-Host "Rebinding: $($report.Name)"
                        .azure-pipelines/scripts/powerbi/rebind-datasource.ps1 `
                          -WorkspaceId '${{ parameters.workspaceId }}' `
                          -DatasetId $report.DatasetId `
                          -ConfigFile '${{ parameters.dataSourceConfigFile }}' `
                          -Environment '${{ parameters.environment }}' `
                          ${{ if eq(parameters.takeOwnership, true) }}:-TakeOver${{ else }}${{ endif }}
                      }
                    }
                  pwsh: true

            # Refresh datasets
            - ${{ if eq(parameters.refreshDataset, true) }}:
              - task: PowerShell@2
                displayName: 'Refresh Datasets'
                inputs:
                  targetType: 'inline'
                  script: |
                    $deployedJson = '$(DeployReports.DeployedReports)'
                    if (-not $deployedJson -or $deployedJson -eq '') {
                      Write-Host "No deployed reports to refresh"
                      exit 0
                    }

                    $deployedReports = $deployedJson | ConvertFrom-Json

                    foreach ($report in $deployedReports) {
                      if ($report.DatasetId -and $report.Type -eq 'pbix') {
                        Write-Host "Refreshing: $($report.Name)"
                        .azure-pipelines/scripts/powerbi/refresh-dataset.ps1 `
                          -WorkspaceId '${{ parameters.workspaceId }}' `
                          -DatasetId $report.DatasetId `
                          -Wait $${{ parameters.waitForRefresh }} `
                          -TimeoutMinutes ${{ parameters.refreshTimeout }}
                      }
                    }
                  pwsh: true

            # Summary
            - task: PowerShell@2
              displayName: 'Deployment Summary'
              condition: always()
              inputs:
                targetType: 'inline'
                script: |
                  Write-Host "##[section]Power BI Deployment Complete"
                  Write-Host "  Environment: ${{ parameters.environment }}"
                  Write-Host "  Workspace: ${{ parameters.workspaceId }}"
                  Write-Host ""
                  Write-Host "View: https://app.powerbi.com/groups/${{ parameters.workspaceId }}"
                pwsh: true
