# Reusable SharePoint Deployment Job
# Uploads files/folders to SharePoint document library

parameters:
  - name: environment
    type: string
    values: [development, validate, production]

  - name: azureSubscription
    type: string

  - name: sharePointSiteUrl
    type: string
    # Example: https://tenant.sharepoint.com/sites/YourSite

  - name: sharePointFolder
    type: string
    # Example: /Shared Documents/GPF - PM Module

  - name: sourceFolder
    type: string
    default: '.'

  - name: filePatterns
    type: string
    default: '**/*'
    # Glob patterns, comma-separated

  - name: excludePatterns
    type: string
    default: ''
    # Patterns to exclude, comma-separated

  - name: cleanTargetFolder
    type: boolean
    default: false

  - name: dryRun
    type: boolean
    default: false

  - name: enabled
    type: boolean
    default: true

jobs:
  - deployment: Deploy_SharePoint_${{ parameters.environment }}
    displayName: 'Deploy to SharePoint (${{ parameters.environment }})'
    condition: eq(${{ parameters.enabled }}, true)
    environment: 'sharepoint-${{ parameters.environment }}'
    pool:
      vmImage: 'windows-latest'
    strategy:
      runOnce:
        deploy:
          steps:
            - checkout: self
              sparse-checkout: |
                .azure-pipelines/scripts

            - task: PowerShell@2
              displayName: 'Install PnP.PowerShell'
              inputs:
                targetType: 'inline'
                script: |
                  Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
                  Install-Module -Name PnP.PowerShell -Force -Scope CurrentUser -AllowClobber
                pwsh: true

            - task: AzurePowerShell@5
              displayName: 'Deploy to SharePoint${{ if eq(parameters.dryRun, true) }} (Dry Run)${{ else }}${{ endif }}'
              inputs:
                azureSubscription: ${{ parameters.azureSubscription }}
                ScriptType: 'FilePath'
                ScriptPath: '.azure-pipelines/scripts/sharepoint/deploy.ps1'
                ScriptArguments: >-
                  -SiteUrl "${{ parameters.sharePointSiteUrl }}"
                  -TargetFolder "${{ parameters.sharePointFolder }}"
                  -SourceFolder "${{ parameters.sourceFolder }}"
                  -FilePatterns "${{ parameters.filePatterns }}"
                  -ExcludePatterns "${{ parameters.excludePatterns }}"
                  ${{ if eq(parameters.cleanTargetFolder, true) }}:-CleanTarget${{ else }}${{ endif }}
                  ${{ if eq(parameters.dryRun, true) }}:-DryRun${{ else }}${{ endif }}
                azurePowerShellVersion: 'LatestVersion'
                pwsh: true

            - task: PowerShell@2
              displayName: 'Deployment Summary'
              inputs:
                targetType: 'inline'
                script: |
                  Write-Host "##vso[task.complete result=Succeeded;]SharePoint deployment completed"
