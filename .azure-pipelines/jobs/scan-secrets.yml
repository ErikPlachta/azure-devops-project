# Reusable Secret Detection Job
# Scans for accidentally committed secrets

parameters:
  - name: workingDirectory
    type: string
    default: '.'

  - name: scanHistory
    type: boolean
    default: false  # Scan git history (slower)

  - name: failOnDetection
    type: boolean
    default: true

  - name: excludePaths
    type: string
    default: ''  # Comma-separated paths to exclude

  - name: enabled
    type: boolean
    default: true

  - name: condition
    type: string
    default: 'succeeded()'

jobs:
  - job: SecretScan
    displayName: 'Secret Detection'
    condition: and(${{ parameters.condition }}, eq(${{ parameters.enabled }}, true))
    pool:
      vmImage: 'ubuntu-latest'
    steps:
      - checkout: self
        fetchDepth: ${{ if eq(parameters.scanHistory, true) }}0${{ else }}1${{ endif }}

      # Gitleaks - Fast and accurate
      - script: |
          # Install gitleaks
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.18.0/gitleaks_8.18.0_linux_x64.tar.gz
          tar -xzf gitleaks_8.18.0_linux_x64.tar.gz
          chmod +x gitleaks

          # Build exclude args
          EXCLUDE_ARGS=""
          if [ -n "${{ parameters.excludePaths }}" ]; then
            for path in $(echo "${{ parameters.excludePaths }}" | tr ',' ' '); do
              EXCLUDE_ARGS="$EXCLUDE_ARGS --exclude-path=$path"
            done
          fi

          # Run scan
          SCAN_MODE="detect"
          if [ "${{ parameters.scanHistory }}" = "true" ]; then
            SCAN_MODE="detect --log-opts=--all"
          fi

          ./gitleaks $SCAN_MODE --source="${{ parameters.workingDirectory }}" --report-path=gitleaks-report.json --report-format=json $EXCLUDE_ARGS

          RESULT=$?
          if [ $RESULT -ne 0 ]; then
            echo "##vso[task.logissue type=error]Secrets detected in codebase"
            cat gitleaks-report.json
            if [ "${{ parameters.failOnDetection }}" = "true" ]; then
              exit 1
            fi
          else
            echo "No secrets detected"
          fi
        displayName: 'Gitleaks scan'
        workingDirectory: ${{ parameters.workingDirectory }}

      # TruffleHog - Additional patterns
      - script: |
          pip install trufflehog3
          trufflehog3 --no-history --format json . > trufflehog-report.json || true

          if [ -s trufflehog-report.json ] && [ "$(cat trufflehog-report.json)" != "[]" ]; then
            echo "##vso[task.logissue type=warning]TruffleHog found potential secrets"
            cat trufflehog-report.json
          fi
        displayName: 'TruffleHog scan'
        workingDirectory: ${{ parameters.workingDirectory }}
        continueOnError: true

      # Publish reports
      - task: PublishBuildArtifacts@1
        displayName: 'Publish secret scan reports'
        inputs:
          pathToPublish: |
            gitleaks-report.json
            trufflehog-report.json
          artifactName: 'security-reports'
        condition: always()
        continueOnError: true
